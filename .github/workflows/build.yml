name: Build

on: [push, workflow_dispatch]

jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [sri-service, ant-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar ${{ matrix.service }}
        run: mvn -B -q -f ${{ matrix.service }}/pom.xml package -DskipTests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
